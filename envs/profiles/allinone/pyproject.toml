# Profile "allinone": generation (vLLM) AND training (HF stack, Unsloth) plus
# the common data/evaluation stack in ONE venv, for jobs that generate and
# train in the same process (e.g. RL with vLLM rollouts, eval-after-train).
#
# Everything follows vLLM's pins because vLLM is the strictest package:
# vllm 0.31.0 pins torch==2.13.0, flashinfer-python==0.7.0.post1 and
# transformers<5.18 (PyPI metadata checked 2026-10-17). Unsloth 2026.10.6
# further caps transformers<=5.17.0, trl<=1.15.0 and datasets<5.
# The headline pins below are what uv resolved with only vllm/torch/unsloth/
# lm-eval pinned (2026-10-18, job 14478 on david01); unsloth 2026.10.6
# co-resolves with vllm 0.31.0 (xformers 0.0.35, torchao 0.18.0 transitively).
# Use the dedicated profiles (serve-vllm, train-hf, train-unsloth) when you
# need the newest torch/transformers for one side only.
# scispacy is NOT included: it needs numpy<2 (see the bio-scispacy profile).
#
# The source-built flash-attn wheel is opt-in (dependency group "flash",
# build.sh --with-flash-attn) because it compiles for 1-3 hours.
[project]
name = "nlpenv-allinone"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- generation / evaluation ---
    "vllm==0.31.0",
    "torch==2.13.0",
    "flashinfer-python==0.7.0.post1",
    "openai",
    "lm-eval==0.4.13",
    # --- training ---
    "transformers==5.17.0",
    "trl==1.15.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "deepspeed==0.19.7",
    "liger-kernel==0.8.4",
    "kernels==0.17.2",
    "bitsandbytes==0.50.2",
    "unsloth==2026.10.6",
    # --- data / classic ML / notebooks (same as "base") ---
    "torchvision==0.28.0",
    "tokenizers",
    "datasets==4.8.5",
    "huggingface-hub[hf-xet]",
    "evaluate",
    "safetensors",
    "sentencepiece",
    "sentence-transformers==6.1.0",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    # xgboost pulls an old nvidia-nccl-cu12 lacking ncclDevCommDestroy, which
    # broke "import torch" in oss-llm-apps; keep the fixed lower bound.
    "nvidia-nccl-cu12>=2.30.7",
    "optuna",
    "matplotlib",
    "seaborn",
    "plotly",
    "spacy>=3.8",
    "lxml",
    "elasticsearch>=8.0.0,<9.0.0",
    "requests",
    "python-dotenv",
    "tqdm",
    "psutil",
    "pynvml",
    "wandb",
    "jupyterlab",
    "ipython",
    "pytest",
]

[dependency-groups]
flash = ["flash-attn==2.8.3.post2"]

[tool.uv]
package = false
# Lock once for both CPU families so x86_64 (David) and aarch64 (Grace, Miyabi-G)
# install the same resolved versions.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

# deepspeed and flash-attn import torch in setup.py; build them against the
# same torch that is installed at runtime.
[tool.uv.extra-build-dependencies]
deepspeed = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }, "ninja", "packaging", "psutil", "wheel"]
